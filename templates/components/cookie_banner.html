<!-- Cookie Consent Banner (la logica è in base.html come Alpine.store) -->
<div x-data x-show="$store.cookie.showBanner"
     x-transition:enter="transition ease-out duration-500"
     x-transition:enter-start="translate-y-full opacity-0"
     x-transition:enter-end="translate-y-0 opacity-100"
     x-transition:leave="transition ease-in duration-300"
     x-transition:leave-start="translate-y-0 opacity-100"
     x-transition:leave-end="translate-y-full opacity-0"
     class="fixed bottom-0 left-0 right-0 z-[100] bg-primary-900 text-white shadow-2xl border-t border-primary-700"
     style="display: none;">

    <div class="container mx-auto px-4 lg:px-8 py-6">

        <!-- Vista compatta -->
        <template x-if="!$store.cookie.showSettings">
            <div>
                <div class="flex flex-col lg:flex-row items-start lg:items-center gap-4 lg:gap-8">
                    <div class="flex-1">
                        <div class="flex items-center mb-2">
                            <svg class="w-6 h-6 text-tertiary-400 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
                            </svg>
                            <h3 class="font-semibold text-lg">La tua privacy è importante</h3>
                        </div>
                        <p class="text-primary-300 text-sm leading-relaxed">
                            Utilizziamo cookie per migliorare la tua esperienza sul nostro sito, analizzare il traffico e personalizzare i contenuti. 
                            Puoi scegliere quali cookie accettare. Per maggiori informazioni, consulta la nostra 
                            <a href="{% url 'core:cookie_policy' %}" class="text-tertiary-400 underline hover:text-tertiary-300">Cookie Policy</a> e la 
                            <a href="{% url 'core:privacy' %}" class="text-tertiary-400 underline hover:text-tertiary-300">Privacy Policy</a>.
                        </p>
                    </div>
                    <div class="flex flex-col sm:flex-row gap-3 w-full lg:w-auto flex-shrink-0">
                        <button @click="$store.cookie.showSettings = true"
                                class="px-5 py-2.5 border border-primary-500 text-primary-200 rounded-sm hover:bg-primary-800 transition-colors text-sm font-medium order-3 sm:order-1">
                            Personalizza
                        </button>
                        <button @click="$store.cookie.rejectAll()"
                                class="px-5 py-2.5 border border-primary-500 text-primary-200 rounded-sm hover:bg-primary-800 transition-colors text-sm font-medium order-2">
                            Rifiuta non essenziali
                        </button>
                        <button @click="$store.cookie.acceptAll()"
                                class="px-5 py-2.5 bg-tertiary-500 text-white rounded-sm hover:bg-tertiary-600 transition-colors text-sm font-medium order-1 sm:order-3">
                            Accetta tutti
                        </button>
                    </div>
                </div>
            </div>
        </template>

        <!-- Vista dettagliata (Personalizza) -->
        <template x-if="$store.cookie.showSettings">
            <div>
                <div class="max-w-3xl mx-auto">
                    <div class="flex items-center justify-between mb-6">
                        <h3 class="text-xl font-semibold">Impostazioni Cookie</h3>
                        <button @click="$store.cookie.showSettings = false" class="text-primary-400 hover:text-white">
                            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                            </svg>
                        </button>
                    </div>

                    <div class="space-y-4 mb-6">

                        <!-- Essenziali -->
                        <div class="bg-primary-800 rounded-lg p-4">
                            <div class="flex items-center justify-between">
                                <div class="flex-1">
                                    <h4 class="font-semibold flex items-center">
                                        <svg class="w-5 h-5 text-green-400 mr-2" fill="currentColor" viewBox="0 0 20 20">
                                            <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"/>
                                        </svg>
                                        Cookie Essenziali
                                    </h4>
                                    <p class="text-primary-400 text-sm mt-1">
                                        Necessari per il funzionamento del sito. Non possono essere disattivati.
                                    </p>
                                </div>
                                <span class="text-green-400 text-sm font-medium ml-4">Sempre attivi</span>
                            </div>
                        </div>

                        <!-- Analytics -->
                        <div class="bg-primary-800 rounded-lg p-4">
                            <div class="flex items-center justify-between">
                                <div class="flex-1">
                                    <h4 class="font-semibold flex items-center">
                                        <svg class="w-5 h-5 text-blue-400 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/>
                                        </svg>
                                        Cookie Analitici
                                    </h4>
                                    <p class="text-primary-400 text-sm mt-1">
                                        Google Analytics - informazioni anonime sull'utilizzo del sito.
                                    </p>
                                </div>
                                <label class="relative inline-flex items-center cursor-pointer ml-4">
                                    <input type="checkbox" x-model="$store.cookie.preferences.analytics" class="sr-only peer">
                                    <div class="w-11 h-6 bg-primary-600 peer-focus:outline-none rounded-full peer
                                                peer-checked:after:translate-x-full peer-checked:after:border-white
                                                after:content-[''] after:absolute after:top-[2px] after:left-[2px]
                                                after:bg-white after:rounded-full after:h-5 after:w-5 after:transition-all
                                                peer-checked:bg-tertiary-500"></div>
                                </label>
                            </div>
                        </div>

                        <!-- Marketing -->
                        <div class="bg-primary-800 rounded-lg p-4">
                            <div class="flex items-center justify-between">
                                <div class="flex-1">
                                    <h4 class="font-semibold flex items-center">
                                        <svg class="w-5 h-5 text-purple-400 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5.882V19.24a1.76 1.76 0 01-3.417.592l-2.147-6.15M18 13a3 3 0 100-6M5.436 13.683A4.001 4.001 0 017 6h1.832c4.1 0 7.625-1.234 9.168-3v14c-1.543-1.766-5.067-3-9.168-3H7a3.988 3.988 0 01-1.564-.317z"/>
                                        </svg>
                                        Cookie di Marketing
                                    </h4>
                                    <p class="text-primary-400 text-sm mt-1">
                                        Annunci e contenuti personalizzati su altri siti.
                                    </p>
                                </div>
                                <label class="relative inline-flex items-center cursor-pointer ml-4">
                                    <input type="checkbox" x-model="$store.cookie.preferences.marketing" class="sr-only peer">
                                    <div class="w-11 h-6 bg-primary-600 peer-focus:outline-none rounded-full peer
                                                peer-checked:after:translate-x-full peer-checked:after:border-white
                                                after:content-[''] after:absolute after:top-[2px] after:left-[2px]
                                                after:bg-white after:rounded-full after:h-5 after:w-5 after:transition-all
                                                peer-checked:bg-tertiary-500"></div>
                                </label>
                            </div>
                        </div>

                    </div>

                    <div class="flex flex-col sm:flex-row gap-3 justify-end">
                        <button @click="$store.cookie.rejectAll()"
                                class="px-5 py-2.5 border border-primary-500 text-primary-200 rounded-sm hover:bg-primary-800 transition-colors text-sm font-medium">
                            Rifiuta non essenziali
                        </button>
                        <button @click="$store.cookie.savePreferences()"
                                class="px-5 py-2.5 bg-tertiary-500 text-white rounded-sm hover:bg-tertiary-600 transition-colors text-sm font-medium">
                            Salva preferenze
                        </button>
                    </div>
                </div>
            </div>
        </template>

    </div>
</div>
