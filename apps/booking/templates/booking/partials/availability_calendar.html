<!-- Availability Calendar Partial - HTMX -->
<div class="bg-white rounded-lg border border-primary-200 overflow-hidden">
    <div class="p-4 bg-primary-50 border-b border-primary-200 flex items-center justify-between">
        <button hx-get="{% url 'booking:htmx_calendar' %}?month={{ prev_month }}&year={{ prev_year }}&unit={{ unit_id }}"
                hx-target="#availability-calendar"
                hx-swap="innerHTML"
                class="p-2 hover:bg-primary-100 rounded-full transition-colors">
            <svg class="w-5 h-5 text-primary-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
            </svg>
        </button>
        <h3 class="font-semibold text-primary-900">
            {{ month_name }} {{ year }}
        </h3>
        <button hx-get="{% url 'booking:htmx_calendar' %}?month={{ next_month }}&year={{ next_year }}&unit={{ unit_id }}"
                hx-target="#availability-calendar"
                hx-swap="innerHTML"
                class="p-2 hover:bg-primary-100 rounded-full transition-colors">
            <svg class="w-5 h-5 text-primary-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
            </svg>
        </button>
    </div>
    
    <div class="p-4">
        <!-- Weekday Headers -->
        <div class="grid grid-cols-7 gap-1 mb-2">
            {% for day_name in weekdays %}
            <div class="text-center text-sm font-medium text-primary-500 py-2">
                {{ day_name }}
            </div>
            {% endfor %}
        </div>
        
        <!-- Calendar Days -->
        <div class="grid grid-cols-7 gap-1">
            {% for day in calendar_days %}
            <div class="aspect-square flex items-center justify-center text-sm
                        {% if day.is_other_month %}text-primary-300{% endif %}
                        {% if day.is_today %}bg-tertiary-100 text-tertiary-700 font-semibold rounded-full{% endif %}
                        {% if day.is_blocked %}bg-red-100 text-red-400 cursor-not-allowed{% endif %}
                        {% if day.is_booked %}bg-primary-200 text-primary-400 cursor-not-allowed{% endif %}
                        {% if day.is_available and not day.is_past %}hover:bg-tertiary-50 cursor-pointer{% endif %}
                        {% if day.is_past %}text-primary-300 cursor-not-allowed{% endif %}"
                 {% if day.is_available and not day.is_past %}
                 @click="selectDate('{{ day.date }}')"
                 {% endif %}>
                {{ day.day }}
            </div>
            {% endfor %}
        </div>
    </div>
    
    <!-- Legend -->
    <div class="px-4 pb-4 flex items-center justify-center space-x-4 text-xs">
        <div class="flex items-center space-x-1">
            <span class="w-3 h-3 rounded bg-tertiary-100 border border-tertiary-200"></span>
            <span class="text-primary-500">Oggi</span>
        </div>
        <div class="flex items-center space-x-1">
            <span class="w-3 h-3 rounded bg-primary-200"></span>
            <span class="text-primary-500">Prenotato</span>
        </div>
        <div class="flex items-center space-x-1">
            <span class="w-3 h-3 rounded bg-red-100"></span>
            <span class="text-primary-500">Non disponibile</span>
        </div>
    </div>
</div>
