{% extends 'base.html' %}
{% load static %}

{% block title %}Password Reimpostata - {{ SITE_NAME }}{% endblock %}

{% block content %}
<div class="min-h-screen bg-villa-50 pt-24 pb-16 flex items-center">
    <div class="container mx-auto px-4">
        <div class="max-w-md mx-auto">
            <div class="bg-white rounded-xl shadow-lg p-8 text-center">
                <div class="w-16 h-16 mx-auto mb-6 bg-green-100 rounded-full flex items-center justify-center">
                    <svg class="w-8 h-8 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
                    </svg>
                </div>
                
                <h1 class="text-2xl font-serif font-semibold text-villa-900 mb-4">
                    Password Reimpostata!
                </h1>
                
                <p class="text-villa-600 mb-6">
                    La tua password è stata reimpostata con successo. Ora puoi accedere con la nuova password.
                </p>
                
                <a href="{% url 'accounts:login' %}" class="btn-primary inline-block">
                    Accedi
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
